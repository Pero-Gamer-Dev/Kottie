name: CI

on:
  push:
    branches: [main, master, "release/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    name: Repository layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify layout matches settings
        run: bash scripts/verify-layout.sh

  docs:
    name: Docs & version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/compatibility.md
          test -f docs/DEFINITION_OF_DONE.md
          test -f docs/migration-guide.md
          test -f docs/publishing.md
          test -f scripts/release-check.sh
          test -f scripts/verify-layout.sh
          test -f gradlew
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle/libs.versions.toml
          grep -E 'version = "[0-9]+\.[0-9]+\.[0-9]+"' build.gradle.kts

  build:
    name: Build (JDK ${{ matrix.java }})
    needs: [layout, docs]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: |
          chmod +x gradlew
          # Avoid CR-only breakage if checked out on Windows tools
          sed -i 's/\r$//' gradlew || true
          head -1 gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build (compile + assemble)
        run: ./gradlew assemble --no-daemon --stacktrace

      - name: Test
        run: ./gradlew :kottie-testkit:test --no-daemon --stacktrace

      - name: Publish libraries to Maven Local
        run: ./gradlew publishToMavenLocal --no-daemon --stacktrace
