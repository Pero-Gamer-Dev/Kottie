name: Flatten kottie directory

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move kottie contents to repository root
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -d kottie ]]; then
            echo "kottie/ directory not found."
            exit 1
          fi

          shopt -s dotglob nullglob
          items=(kottie/*)

          if ((${#items[@]} == 0)); then
            echo "kottie/ is already empty."
            exit 0
          fi

          # Remove any existing root-level files/folders that would conflict
          # with the flattened project files. This is intentional for the
          # flattening workflow.
          for src in "${items[@]}"; do
            name="$(basename "$src")"

            if [[ "$name" == ".git" ]]; then
              continue
            fi

            dest="./${name}"
            if [[ -e "$dest" || -L "$dest" ]]; then
              echo "Removing conflicting root item: $dest"
              rm -rf -- "$dest"
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for src in "${items[@]}"; do
            name="$(basename "$src")"

            if [[ "$name" == ".git" ]]; then
              continue
            fi

            git mv -- "$src" .
          done

          rmdir kottie 2>/dev/null || true
          git add -A
          git diff --cached --quiet || git commit -m "Move kottie contents to repository root"
          git push origin "HEAD:${GITHUB_REF_NAME}"
