name: Extract ZIP

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: Path to the ZIP file in the repository
        required: true
        default: archive.zip
      extract_to:
        description: Directory where the ZIP contents will be extracted
        required: true
        default: extracted

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract ZIP file
        shell: bash
        env:
          ZIP_FILE: ${{ inputs.zip_file }}
          EXTRACT_TO: ${{ inputs.extract_to }}
        run: |
          set -euo pipefail

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "ZIP file not found: $ZIP_FILE" >&2
            exit 1
          fi

          # Keep the destination inside the checked-out workspace.
          if [[ "$EXTRACT_TO" = /* || "$EXTRACT_TO" == ".." || "$EXTRACT_TO" == ../* || "$EXTRACT_TO" == */../* || "$EXTRACT_TO" == */.. ]]; then
            echo "Extraction directory must be a relative path without '..': $EXTRACT_TO" >&2
            exit 1
          fi

          mkdir -p "$EXTRACT_TO"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_TO"
          echo "Extracted $ZIP_FILE into $EXTRACT_TO"

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: extracted-files
          path: ${{ inputs.extract_to }}
          if-no-files-found: error
